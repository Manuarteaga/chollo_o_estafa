<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CholloScore | Analizador Inteligente de Coches de Ocasión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: {
                            850: '#151e32',
                            900: '#0f172a',
                            950: '#090d16',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090d16;
            color: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.06) 0px, transparent 50%);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        .score-ring {
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.5s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-emerald-500/30 selection:text-emerald-200 p-2 sm:p-4">

    <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-30 rounded-xl mb-6">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight text-white">Chollo<span class="text-emerald-400">Score</span></span>
                    <span class="hidden sm:inline-block ml-2 text-[11px] font-mono uppercase tracking-wider px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Coches de Ocasión</span>
                </div>
            </div>
            <div class="flex items-center gap-3 text-xs text-slate-400">
                <span class="hidden md:inline">Enfoque: <strong class="text-slate-200">Contado vs. Financiación</strong></span>
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Auditor Activo
                </span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-2 sm:px-6 py-2 space-y-6">

        <section class="glass-card rounded-2xl p-5 sm:p-7 shadow-xl space-y-5">
            <div class="max-w-3xl mx-auto text-center space-y-1.5">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">
                    Analizador Inteligente de Precios de Coches de Ocasión
                </h1>
                <p class="text-sm text-slate-400">
                    Evalúa el precio al contado frente a la depreciación teórica, estado de batería (en EV/PHEV) y financiación.
                </p>
            </div>

            <!-- Marca y Modelo con escritura libre + desplegable dinámico -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-slate-800/80">
                <div class="space-y-2">
                    <label for="select-marca" class="block text-xs font-mono uppercase text-slate-400">Marca del Vehículo</label>
                    <select id="select-marca" class="w-full px-3.5 py-2.5 bg-slate-950/90 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500"></select>
                    <input
                        type="text"
                        id="input-marca-man"
                        placeholder="¿Otra marca? Escríbela aquí (ej. BYD, Omoda, Cupra...)"
                        class="w-full px-3.5 py-2 bg-slate-950/90 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:border-sky-500"
                    >
                </div>

                <div class="space-y-2">
                    <label for="select-modelo" class="block text-xs font-mono uppercase text-slate-400">Modelo del Vehículo</label>
                    <select id="select-modelo" class="w-full px-3.5 py-2.5 bg-slate-950/90 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500"></select>
                    <input
                        type="text"
                        id="input-modelo-man"
                        placeholder="¿Otro modelo? Escríbelo aquí..."
                        class="w-full px-3.5 py-2 bg-slate-950/90 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:border-sky-500"
                    >
                </div>
            </div>

            <!-- Especificaciones y Precios -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-2 border-t border-slate-800/80">
                <div>
                    <label for="precio-nuevo" class="block text-xs font-mono uppercase text-slate-400 mb-1.5">Precio Nuevo Original (€)</label>
                    <input type="number" id="precio-nuevo" value="25000" min="0" step="500" class="w-full px-3.5 py-2.5 bg-slate-950/90 border border-slate-700 rounded-xl text-sm font-mono text-white">
                </div>
                <div>
                    <label for="potencia-cv" class="block text-xs font-mono uppercase text-slate-400 mb-1.5">Potencia (CV)</label>
                    <input type="number" id="potencia-cv" value="110" min="30" max="1000" step="5" class="w-full px-3.5 py-2.5 bg-slate-950/90 border border-slate-700 rounded-xl text-sm font-mono text-white">
                </div>
                <div>
                    <label for="transmision" class="block text-xs font-mono uppercase text-slate-400 mb-1.5">Transmisión</label>
                    <select id="transmision" class="w-full px-3.5 py-2.5 bg-slate-950/90 border border-slate-700 rounded-xl text-sm text-white">
                        <option value="Manual">Manual</option>
                        <option value="Automática">Automática</option>
                    </select>
                </div>
                <div>
                    <label for="combustible" class="block text-xs font-mono uppercase text-slate-400 mb-1.5">Combustión</label>
                    <select id="combustible" class="w-full px-3.5 py-2.5 bg-slate-950/90 border border-slate-700 rounded-xl text-sm text-white">
